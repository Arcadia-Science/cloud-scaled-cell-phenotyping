[project]
name = "notebook-pub-contents"
description = "Python project for notebook publication."
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "arcadia-pycolor>=0.8.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "numpy>=2.5.1",
    "plotly>=6.9.0",
    "arcadia-microscopy-tools>=0.5.0",
    "modal>=1.5.3",
]

[project.optional-dependencies]
# Heavy compute stack for the Modal segmentation workers. Installed only into the
# worker container image via `uv_sync(extras=["worker"])`, and imported exclusively
# inside Modal functions (never at local notebook import time), so the local env
# stays light. Pinned through uv.lock for reproducible image builds.
worker = [
    "arcadia-microscopy-tools[segmentation]>=0.5.0", # [segmentation] brings cellpose + torch
    "nd2>=0.10.3",                                    # ND2 reading
    "tifffile",                                       # label-mask TIFF output
    "pillow",                                         # overlay JPEG output
]

# Local (no-cloud) demo stack for external readers. Installs the same segmentation
# stack as `worker` into the *local* env so the notebook's local fallback path can
# fetch example ND2s from Zenodo and run Cellpose-SAM on CPU without Modal or S3.
# Install with `uv sync --extra demo` (or `pip install .[demo]`). Internal readers
# with Modal + bucket access can skip this and use the scaled path.
demo = [
    "arcadia-microscopy-tools[segmentation]>=0.5.0",
    "nd2>=0.10.3",
    "tifffile",
    "pillow",
]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "ruff>=0.9.6",
    "jupyterlab>=4.3.5",
    "pyyaml>=6.0.2",
    "jupyterlab-quarto>=0.3.5",
    "ty>=0.0.65",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ty.analysis]
# The heavy segmentation stack (torch + cellpose) ships only in the `worker`/`demo`
# extras and is imported lazily inside functions, so it is not installed in the
# lint/typecheck environment (or CI). Allow those imports to stay unresolved there
# rather than failing the type check.
allowed-unresolved-imports = ["torch.**", "cellpose.**"]

[tool.ruff]
# The directories to consider when resolving first- vs. third-party imports
src = ["."]
line-length = 100
indent-width = 4

# run ruff on jupyter notebooks (this is not enabled by default)
extend-include = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# ignore star and unused imports
"__init__.py" = ["F403", "F405"]
"index*.ipynb" = [
    # Markdown paragraphs are converted to single line comments that extend past line limit. Ignore.
    "E501",
    # Cells often end with useless expressions. Ignore.
    "B018",
    # Allow imports throughout the file.
    "E402",
    # Allow re-definition of imports. Sometimes imports lead to warnings, that we can supress in the
    # render by moving them to a cell with `# | output: false`. But for clarity, the import should
    # remain in the place where it was originally defined.
    "F811",
]

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pycodestyle error
    "E",
    # pyflakes
    "F",
    # isort
    "I",
    # pyupgrade
    "UP",
    # pycodestyle warning
    "W",
]

# rule codes to ignore
ignore = []

# Allows fix for all enabled rules when `--fix` is provided
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes, indent with spaces, and respect trailing commas
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
order-by-type = true
no-lines-before = ["future", "standard-library"]
